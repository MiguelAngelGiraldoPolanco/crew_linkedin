[project]
name = "linkedin_agents_os"
version = "0.1.0"
description = "linkedin_agents_os using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5a2"
]

[project.scripts]
linkedin_agents_os = "linkedin_agents_os.main:run"
run_crew = "linkedin_agents_os.main:run"
train = "linkedin_agents_os.main:train"
replay = "linkedin_agents_os.main:replay"
test = "linkedin_agents_os.main:test"
run_with_trigger = "linkedin_agents_os.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
