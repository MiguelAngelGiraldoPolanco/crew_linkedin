tarea_redaccion:
  description: >
    Toma la nota técnica diaria proporcionada en el archivo Markdown (que detalla el avance del proyecto 'LinkedIn-Agent-OS', problemas con Conda/Python, o desarrollo de IA local) y redáctala en un post de LinkedIn de alto impacto. 
    Debes estructurar el contenido siguiendo estas fases:
    1. Un gancho (hook) de máximo 2 líneas que genere curiosidad o rompa un mito tech.
    2. El núcleo técnico explicado de forma cercana, como de desarrollador a desarrollador.
    3. Una sección de aprendizaje ("Lección aprendida").
    Evita bloques de texto de más de dos frases seguidas. Usa saltos de línea dobles.
  expected_output: >
    Un primer borrador completo del post de LinkedIn estructurado para una lectura rápida (escaneable), con un tono técnico pero fresco.
  agent: copywriter

tarea_revision_critica:
  description: >
    Analiza minuciosamente el borrador generado por el copywriter. Actúa como el filtro de calidad más estricto del algoritmo de LinkedIn. 
    Debes auditar el texto buscando y eliminando:
    - Palabras cliché de IA (ej. "En el panorama actual", "revolucionario", "crucial", "descubre cómo").
    - Formatos densos que afecten negativamente al Dwell Time.
    - Exceso de emojis o hashtags (máximo 2-3 hashtags muy relevantes al final).
    Si el post parece generado por ChatGPT, reescribe las secciones artificiales para que suene 100% humano, directo y con autoridad técnica. Asegúrate de que termine con una pregunta abierta que incite al debate en comentarios.
  expected_output: >
    El post definitivo de LinkedIn en texto limpio, optimizado para el algoritmo, listo para copiar y pegar.
  agent: critico